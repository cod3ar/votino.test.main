<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de eventos</title>

  <style>
    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, sans-serif;
      color: #202124;
      background: #f7f8fa;
    }

    h1, h2 { margin-bottom: .5rem; }

    section, .card {
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    label {
      display: block;
      margin: .75rem 0 .25rem;
    }

    input, select {
      box-sizing: border-box;
      width: 100%;
      max-width: 420px;
      padding: .65rem;
      margin-bottom: .5rem;
    }

    button {
      padding: .6rem .85rem;
      margin: .25rem .25rem .25rem 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    #totals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .75rem;
    }

    .card { margin: 0; }

    .count {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .muted { color: #555; }
    .error { color: #a40000; }
    .success { color: #176b31; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: .6rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    [hidden] {
      display: none !important;
    }

    .card.evento-1 {
      background-color: #e8f5e9;
      border-color: #81c784;
    }
    
    .card.evento-2 {
      background-color: #fff3e0;
      border-color: #ffb74d;
    }
    
    .card.evento-3 {
      background-color: #ffebee;
      border-color: #e57373;
    }

    /* Estilos adaptativos para la cabecera de sesión y mobile */
    .session-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.5rem;
      margin-bottom: 1rem;
    }

    .logout-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .refresh-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
      width: 100%;
    }

    /* Alineación forzada a la derecha para el botón de borrado */
    #deleteAllEventsButton {
      background-color: #fee2e2;
      border: 1px solid #ef4444;
      color: #b91c1c;
      margin-left: auto;
    }

    .last-vote-info {
      margin-top: .75rem;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .table-wrap { overflow-x: auto; }
      
      .session-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      #deleteAllEventsButton {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <h1>Sistema de Voto Electrónico</h1>
  <p id="status" class="muted" aria-live="polite"></p>

  <!-- PANEL DE LOGIN -->
  <section id="loginPanel">
    <h2>Iniciar sesión</h2>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <p></p>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <!-- PANEL PRINCIPAL DE LA APLICACIÓN -->
  <section id="appPanel" hidden>
    <div class="session-info">
      <div>Sesión: <strong id="userEmail"></strong></div>
      <div>Perfil: <strong id="userRole"></strong></div>
      
      <div class="logout-group">
        <button id="logoutButton" type="button">Cerrar sesión</button>
        <span id="timerContainer" aria-live="off">
          (logout en: <strong id="timerCountdown">--</strong>s)
        </span>
      </div>
    </div>

    <h2>Votos Acumulados</h2>

    <div id="totals">
      <div class="card evento-1">
        Positivos
        <div class="count" id="total1">—</div>
      </div>
    
      <div class="card evento-2">
        Neutros
        <div class="count" id="total2">—</div>
      </div>
    
      <div class="card evento-3">
        Negativos
        <div class="count" id="total3">—</div>
      </div>
    </div>

    <p class="last-vote-info muted">Último voto registrado: <strong id="lastVoteTime">—</strong></p>

    <p></p>
    <div class="refresh-group">
      <button id="refreshButton" type="button">Actualizar totales</button>
      <span class="muted" aria-live="off">
        (actualiza en: <strong id="refreshCountdown">--</strong>s)
      </span>
      <!-- Botón de borrado masivo alineado a la derecha mediante CSS (solo admin) -->
      <button id="deleteAllEventsButton" type="button" hidden>
        Borrar todos los registros
      </button>
    </div>
    <pre id="totalsDetails" class="muted"></pre>

    <!-- SECCIÓN ADMINISTRATIVA -->
    <section id="adminPanel" hidden>
      <h2>Administración de usuarios</h2>

      <div class="admin-actions">
        <button id="refreshUsersButton" type="button">Actualizar lista</button>
        <button id="toggleCreateUserButton" type="button
